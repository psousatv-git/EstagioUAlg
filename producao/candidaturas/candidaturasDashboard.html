<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<meta name="description" content="" />
<meta name="author" content="" />

<title>Candidaturas</title>
<link
  rel="icon"
  type="image/png"
  sizes="16x16"
  href="../../templates/favicon.png"/>

<!-- CSS -->
<!-- Bootstrap -->
<link href="../../vendors/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css">
<!-- Fontawesome -->
<!--<link href="../../vendors/font-awesome/all.min.css" rel="stylesheet" type="text/css">-->
<link href="../../vendors/fonts/all.min.css" rel="stylesheet" type="text/css">
<!-- Datables -->
<link href="../../vendors/datatables/datatables.min.css" rel="stylesheet" type="text/css">
<!-- GLOBAL -->
<link href="../../global/css/styles.css" rel="stylesheet" type="text/css">

<style>
    /* Adiciona uma imagem em 'background' a toda a página */
    body  {
      background-image: url('../../global/imagens/bgPages.jpg');
      background-size: cover;
    }
</style>

</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand navbar-dark bg-dark shadow-sm">
        <a class="navbar-brand" href="../../index.html">Candidaturas</a>

        <div class="ml-auto d-flex align-items-center">
            <a class="btn btn-outline-light btn-sm mr-3" href="../../index.html">
                <i class="fa fa-home"></i>
            </a>
            <span class="text-white-50 small">Paulo Sousa © 2024</span>
        </div>
    </nav>

    <div id="layoutSidenav_content">
        <h1 class="mt-2"></h1>
        <div class="container-fluid">

            <!-- Informações Gerais -->
            <div class="row">
                <div class="col-12">

                    <div class="card">
                        <!--
                        <div class="card-header">
                            <i class="fas fa-euro"></i> Candidaturas 
                        </div>
                        -->

                        <div class="card-body">

                            <!-- Indicadores -->
                            <div class="row mt-1">
                                <div class="col-12">
                                    <div class="col-3 px-3 py-1 bg-primary text-white fw-bold rounded">
                                    Principais Indicadores
                                    </div>
                                    <div class="mt-1">
                                    <div class="row" id="botoesIndicadores"></div>
                                    </div>
                                    <div class="mt-1">
                                        <div class="row" id="tabelaIndicadores"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Candidaturas Noutros Estados -->
                            <div class="row mt-1">
                                <div class="col-3 px-3 py-1 bg-dark text-white fw-bold rounded">
                                    Candidaturas Noutros Estados
                                </div>
                                <div class="col-12 mt-1">
                                    <div class="row" id="cartoesCandidaturaOutroEstado"></div>
                                </div>
                                </div>

                            <!-- Candidaturas Em Curso -->
                            <div class="row mt-1">
                                <div class="col-3 px-3 py-1 bg-primary text-white fw-bold rounded">
                                Candidaturas Em Curso
                                </div>
                                <div class="col-12 mt-1">
                                <div class="row" id="cartoesCandidaturaEmCurso"></div>
                                </div>
                            </div>
                            
                            <!-- Candidaturas Encerradas -->
                            <div class="row mt-1">
                                <div class="col-3 px-3 py-1 bg-secondary text-white fw-bold rounded">
                                Candidaturas Encerradas
                                </div>
                                <div class="col-12 mt-1">
                                <div class="row" id="cartoesCandidaturaEncerrada"></div>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        
            <!-- Tabela de Candidaturas -->
            <div class="row mt-2">
                <div class="col-12">
                    <div class="card">
                        <!--
                        <div class="card-header">
                            <i class="fas fa-table mr-1"></i> Candidaturas
                        </div>
                        -->
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered table-hover table-striped" id="tabela" width="100%">
                                    <thead class="small text-center">
                                        <tr>
                                            <th class="text-left">Candidatura</th>
                                            <th class="text-right">Taxa</th>
                                            <th class="text-right">(I)nvestimento</th>
                                            <th class="text-right">(E)legível</th>
                                            <th class="text-right">(Ad)judicado</th>
                                            <th class="text-right">(F)aturado</th>
                                            <th class="text-right">(R)ecebido</th>
                                            <th class="text-right">FR %</th> <!-- Faturado / Recebido -->
                                            <th class="text-right">ER %</th> <!-- Elegível / Recebido -->
                                        </tr>
                                    </thead>
                                    <tbody class="small">
                                        <!-- Linhas preenchidas pelo JS -->
                                    </tbody>
                                    <tfoot class="small">
                                        <tr>
                                            <th class="text-left">Total:</th>
                                            <th class="text-right"></th>
                                            <th class="text-right"></th> <!-- Elegível -->
                                            <th class="text-right"></th> <!-- Elegível -->
                                            <th class="text-right"></th> <!-- Adjudicado -->
                                            <th class="text-right"></th> <!-- Faturado -->
                                            <th class="text-right"></th> <!-- Recebido -->
                                            <th class="text-right"></th>
                                            <th class="text-right"></th>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>           
            
        </div>
    </div>

    <!-- JQuery - Deve Ser incluido antes do Global -->
    <script src="../../vendors/jquery/jquery.js"></script>
    <!-- Global -->
    <script src="../../global/js/scripts.js"></script>
    
    <!-- Bootstrap -->
    i<script src="../../vendors/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- Fontawesome -->
    <!--<script src="../../vendors/font-awesome/all.min.js"></script>-->
    <script src="../../vendors/fonts/all.min.js"></script>
    <!-- Bootstrap -->
    <script src="../../vendors/datatables/datatables.min.js"></script>
    <!-- Charts -->
    <script src="../../vendors/charts/chart.umd.min.js"></script>

<!-- JS de Página -->
    <script src="js/candidaturasDashboard.js"></script>

</body>
</html>
