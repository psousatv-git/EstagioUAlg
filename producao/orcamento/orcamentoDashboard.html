<style>
    /* Adiciona uma imagem em 'background' a toda a página */

      background-image: url('../../global/imagens/bgPages.jpg');
      background-size: cover;
    }
</style>

<body onload="anoDefault()">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand navbar-dark bg-dark shadow-sm">
        <a class="navbar-brand" href="../../index.html">Orçamento</a>

        <div class="ml-auto d-flex align-items-center">
            <a class="btn btn-outline-light btn-sm mr-3" href="../../index.html">
                <i class="fa fa-home"></i>
            </a>
            <span class="text-white-50 small">Paulo Sousa © 2024</span>
        </div>
    </nav>
    
    <div id="layoutSidenav_content">
        <h1 class="mt-2"></h1>
        <div class="container-fluid">
            <!-- Dashboard Cards -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <!-- Formulario para escolha do ano do Orçamento - Default = Ano Corrente -->
                            <div class="btn btn-info text-white text-left">
                                <form onsubmit="return false;">
                                    <label style="text-align: left" for="anoCorrente">Orçamento do Ano:
                                        <input id="anoCorrente" style="text-align: right" type="text"
                                        autofocus>
                                    </label>
                                    <button type="button" class="btn btn-dark" onclick="mudaAno()" >Alterar</button>
                                </form>
                            </div>
                        </div>
                        
                        <div class="card-body">
                            <!-- Investimentos -->
                            <h5 class="badge badge-primary mb-3">Investimentos</h5>
                            <div class="row" id="cartoesInvestimentos"></div>
        
                            <!-- Gastos -->
                            <h5 class="badge badge-info mt-4 mb-3">Gastos</h5>
                            <div class="row" id="cartoesGastos"></div>

                            <!-- Protocolos -->
                            <h5 class="badge badge-info mt-4 mb-3">Protocolos</h5>
                            <div class="row" id="cartoesProtocolos"></div>

                        </div>
                    </div>
                </div>
            </div>

            <h1 class="mt-2"></h1>
        
        </div>
    </div>

    <!-- JQuery - Deve Ser incluido antes do Global -->
    <script src="../../vendors/jquery/jquery.js"></script>

    <!-- JS de Página -->

    <script src="js/orcamentoDashboard.js"></script>
